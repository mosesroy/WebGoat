name: DevSecOps Pipeline

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:

# ─────────────────────────────────────────
# STAGE 1: Secrets Detection with Gitleaksa
# ─────────────────────────────────────────
  secrets-scan:
    name: Secrets Detection (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ─────────────────────────────────────────
# STAGE 2: SAST with Semgrep
# ─────────────────────────────────────────
  sast-scan:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    needs: secrets-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/java \
            --config p/owasp-top-ten \
            --config p/secrets \
            --sarif \
            --output semgrep-results.sarif \
            --severity WARNING \
            . 
        continue-on-error: true

      - name: Upload Semgrep results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-results
          path: semgrep-results.sarif

      - name: Debug NVD Key
        run: |
          if [ -z "${{ secrets.NVD_API_KEY }}" ]; then
            echo "NVD_API_KEY is EMPTY"
          else
            echo "NVD_API_KEY is SET and has length: ${#NVD_KEY}"
          fi
        env:
          NVD_KEY: ${{ secrets.NVD_API_KEY }}



# ─────────────────────────────────────────
# STAGE 3: SCA - OWASP Dependency Checks
# ─────────────────────────────────────────
  sca-scan:
    name: SCA (OWASP Dependency Check)
    runs-on: ubuntu-latest
    needs: sast-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        env:
            NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        with:
          project: 'WebGoat'
          path: '.'
          format: 'HTML'
          args: >
            --enableRetired
            --enableExperimental
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
        continue-on-error: true

      - name: Upload Dependency Check results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-results
          path: ${{github.workspace}}/reports

# ─────────────────────────────────────────
# STAGE 4: Build with Maven
# ─────────────────────────────────────────
  build:
    name: Build (Maven)
    runs-on: ubuntu-latest
    needs: sca-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          architecture: x64

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Build with Maven
        run: mvn --no-transfer-progress clean package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: webgoat-jar
          path: target/*.jar
          
# ─────────────────────────────────────────
# STAGE 5: Container Image Scan (Trivy)
# ─────────────────────────────────────────
  image-scan:
    name: Container Image Scan (Trivy)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: webgoat-jar
          path: target/

      - name: Build Docker image
        run: docker build -t webgoat:${{ github.sha }} .

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: webgoat:${{ github.sha }}
          format: table
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          output: trivy-results.txt

      - name: Upload Trivy results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: trivy-results.txt
# ─────────────────────────────────────────
# STAGE 6: DAST - OWASP ZAP Baseline Scan
# ─────────────────────────────────────────
  dast-scan:
    name: DAST (OWASP ZAP Baseline)
    runs-on: ubuntu-latest
    needs: image-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: webgoat-jar
          path: target/

      - name: Build Docker image
        run: docker build -t webgoat:${{ github.sha }} .

      - name: Start WebGoat container
        run: |
          docker run -d \
            --name webgoat \
            -p 8080:8080 \
            -e WEBGOAT_HOST=0.0.0.0 \
            webgoat:${{ github.sha }}

      - name: Wait for WebGoat to be ready
        run: |
          echo "Waiting for WebGoat to start..."
          for i in {1..30}; do
            if curl -s http://localhost:8080/WebGoat/login | grep -q "WebGoat"; then
              echo "WebGoat is up!"
              break
            fi
            echo "Attempt $i/30 - not ready yet, waiting 10s..."
            sleep 10
          done

      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:8080/WebGoat'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-I'
        continue-on-error: true

      - name: Upload ZAP results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-results
          path: report_html.html

      - name: Stop WebGoat container
        if: always()
        run: docker stop webgoat && docker rm webgoat
